
name: Build Ghamis Lab Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract lab project
        run: |
          unzip -q Ghamis_Lab_System_Complete_Project.zip -d .
          test -f Ghamis_Lab_System/package.json
          test -f Ghamis_Lab_System/capacitor.config.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: Ghamis_Lab_System
        run: npm install

      - name: Prepare web assets
        working-directory: Ghamis_Lab_System
        run: npm run copy:web

      - name: Create Android project
        working-directory: Ghamis_Lab_System
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        working-directory: Ghamis_Lab_System
        run: npx cap sync android

      - name: Build APK
        working-directory: Ghamis_Lab_System/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghamis-Lab-System-APK
          path: Ghamis_Lab_System/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
