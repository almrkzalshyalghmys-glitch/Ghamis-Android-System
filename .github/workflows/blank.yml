
name: Build Ghamis Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Check Android project files
        run: |
          echo "Checking repository files..."
          ls -la
          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew is missing."
            echo "This repository needs a complete Android Gradle project."
            exit 1
          fi
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Android settings.gradle file is missing."
            exit 1
          fi
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle file is missing."
            exit 1
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ghamis-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
